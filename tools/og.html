<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>OG image</title>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Inter:wght@500;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#F3EDE4;color:#15171C;font-family:Inter,sans-serif;position:relative}
  .brand{position:absolute;left:60px;top:46px;display:flex;align-items:center;gap:16px;font:800 30px Archivo,sans-serif}
  .mark{width:46px;height:46px;border-radius:12px;background:#3B55E6;display:grid;place-items:center}
  .mark svg{width:30px;height:30px;fill:#fff;stroke:#fff;stroke-width:1.6}
  .brand b{color:#3B55E6}
  h1{position:absolute;left:56px;top:128px;font:900 150px/.9 Archivo,sans-serif;letter-spacing:-.035em;text-transform:uppercase}
  h1 span{display:block}
  .bar{position:absolute;left:0;right:0;bottom:0;height:110px;background:#15171C;color:#F3EDE4;display:flex;align-items:center;gap:22px;padding:0 60px;font:500 30px Inter,sans-serif}
  .bar i{width:7px;height:7px;border-radius:50%;background:#C26A4A}
  .bar em{font-style:normal;color:#8496FF}
  .fade{position:absolute;left:0;right:0;bottom:110px;height:120px;background:linear-gradient(transparent,#15171C)}
  img{position:absolute;right:40px;bottom:0;height:600px;filter:drop-shadow(0 24px 30px rgba(14,16,20,.18))}
  .dot{position:absolute;right:70px;top:40px;width:300px;height:300px;border-radius:50%;background:#3B55E6;opacity:.95}
</style></head>
<body>
  <div class="dot"></div>
  <div class="brand"><span class="mark"><svg viewBox="0 0 32 32"><circle cx="8" cy="9" r="3"/><circle cx="24" cy="7" r="3"/><circle cx="16" cy="18" r="3.4"/><circle cx="7" cy="25" r="3"/><circle cx="25" cy="25" r="3"/><path d="M8 9 16 18 24 7M16 18 7 25M16 18 25 25"/></svg></span><span>NeuroCode<b>_Med</b></span></div>
  <h1><span>AI &amp; Data</span><span>Engineer</span></h1>
  <img src="../assets/img/med-cutout.webp" alt="">
  <div class="fade"></div>
  <div class="bar"><span>Mohamed Messaoudi</span><i></i><em>AI, data &amp; full-stack</em><i></i><span>Morocco</span></div>
</body></html>
